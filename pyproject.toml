[project]
name = "supplychainlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vs-abhinav-dev", email = "abhinav21221@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "semver>=3.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
supplychainlens = "supplychainlens:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
